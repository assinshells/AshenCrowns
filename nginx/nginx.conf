server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 — встроенный DNS докера на пользовательских bridge-сетях.
    # Без resolver + переменной nginx резолвит "backend" ОДИН раз при
    # старте и кэширует IP навсегда. Если backend-контейнер пересоздаётся
    # (например, после падения из-за гонки с postgres на старте) — он
    # получает новый IP, а nginx продолжает стучаться в старый и отдаёт
    # 502, пока сам не перезапустится. Переменная в proxy_pass заставляет
    # nginx резолвить хост через resolver при каждом запросе.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Serve the built React app; fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy REST API calls to the backend service
    location /api/auth/ {
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
    }

    # Reverse proxy WebSocket traffic (Socket.IO) to the backend service
    location /socket.io/ {
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static asset caching
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}