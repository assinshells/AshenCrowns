name: chat-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-postgre}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # См. комментарий в docker/dev/compose.yml — на init postgres
      # перезапускает себя, и одиночная проверка может поймать ложный
      # "healthy" ещё до реального рестарта. Требуем два ответа подряд.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgre} -d ${POSTGRES_DB:-postgre} -q && sleep 1 && pg_isready -U ${POSTGRES_USER:-postgre} -d ${POSTGRES_DB:-postgre} -q"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 10
    networks:
      - chat-network
    # Not exposed on the host in production; only reachable by other services

  redis:
    image: redis:7-alpine
    container_name: chat-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - chat-network

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: chat-backend
    restart: unless-stopped
    env_file:
      - path: ../../backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgre}:${POSTGRES_PASSWORD:-root}@postgres:5432/${POSTGRES_DB:-postgre}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - chat-network
    # Not exposed on the host in production; nginx reverse-proxies to it

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: ""
    container_name: chat-frontend
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - chat-network

networks:
  chat-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: